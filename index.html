<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infere</title>
<meta name="description" content="Infere S.A.S. Desarrollo de software. Bogotá, Colombia.">
<style>
  :root { --bg: #f7f7f5; --fg: #16181d; --muted: #6b7079; --accent: #3b5bdb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111317; --fg: #eceef2; --muted: #9aa0aa; --accent: #8ea8ff; } }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  h1 { font-size: clamp(48px, 12vw, 96px); font-weight: 700; letter-spacing: -0.04em; }
  h1 span { color: var(--accent); }
  p.lead { margin-top: 12px; font-size: clamp(17px, 3vw, 21px); }
  p.soon { margin-top: 28px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; font-size: 13px; }
  footer { position: fixed; bottom: 20px; left: 0; right: 0; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <h1>infere<span>.</span></h1>
  <p class="lead">Desarrollo de software a la medida.</p>
  <p class="soon">Próximamente</p>
  <footer>Infere S.A.S. · Bogotá, Colombia</footer>
</body>
</html>
